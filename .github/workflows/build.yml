name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须与 AGP 8.13.2 匹配：AGP 8.x 无法在 Gradle 9.6+ 上运行
  # （org.gradle.api.problems.internal.InternalProblems 在 Gradle 9.6.0 被移除）。
  #
  # ⚠ 已知警告（**不阻塞构建**）：CI 日志里会出现
  #     w: ⚠️ Deprecated Gradle Version
  #     The minimum supported Gradle version will become Gradle 8.14.4 in Kotlin 2.5.0.
  #   当前 Kotlin 是 2.4.20，因此现在只是警告。
  #   **等升级到 Kotlin 2.5+ 时**必须同时把这里与 gradle-wrapper.properties 升到 8.14.4：
  #     ./gradlew wrapper --gradle-version 8.14.4 --distribution-type bin
  #   不提前升级的原因：Gradle 版本变更曾导致 AGP 8.13.2 直接无法运行，
  #   为一个警告去动构建基础设施不划算。
  GRADLE_VERSION: "8.13"

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # ★ 必须取全量历史：versionCode 由 git 提交数推导，
          #   浅克隆（默认 depth=1）下 `git rev-list --count HEAD` 永远是 1，
          #   版本号就永远不递增了。
          fetch-depth: 0

      # ★ 构建指纹：一眼判断「这份日志是不是新版工作流产出的」。
      #   排查时最常见的坑就是拿着一份旧日志分析半天（本项目已经踩过）。
      - name: Build fingerprint
        run: |
          echo "=========================================================="
          echo " Nuntra CI 构建指纹"
          echo " 工作流版本: fixed-signing + versionCode + backup/restore v2"
          echo " commit   : ${{ github.sha }}"
          echo " run      : #${{ github.run_number }}  attempt ${{ github.run_attempt }}"
          echo " 时间(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "=========================================================="

      # 构建指纹与下面的 gradle 输出一并留档；若日志里没有上面这段横幅，
      # 就说明它是旧工作流产出的，不要拿来排查当前问题。
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 关键：显式指定 Gradle 版本。
      # 不使用 gradle/actions/setup-gradle 的自动检测，避免运行器自带的新版 Gradle
      # 通过 gradle wrapper 覆盖 wrapper 属性（上一版 CI 就是这样失败的）。
      - name: Set up Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar 缺失，使用 Gradle ${GRADLE_VERSION} 生成（版本显式指定，不会漂移）"
            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          else
            echo "wrapper jar 已存在，保持不变"
          fi
          chmod +x ./gradlew
          echo "--- 版本自检 ---"
          ./gradlew --version | tee wrapper-version.txt
          grep -q "${GRADLE_VERSION}" wrapper-version.txt || {
            echo "ERROR: wrapper 报告的 Gradle 版本与预期的 ${GRADLE_VERSION} 不一致"
            exit 1
          }

      # ── 固定签名 ──
      # 没有固定签名时，Actions 每次都是全新运行器，AGP 会**自动生成一个新的
      # debug 密钥**，于是每次 APK 签名都不同 → Android 拒绝覆盖安装
      # （INSTALL_FAILED_UPDATE_INCOMPATIBLE）→ 必须先卸载 → DataStore 数据全丢。
      - name: Configure fixed debug signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            mkdir -p app/keystore
            printf "%s" "$KEYSTORE_BASE64" | base64 -d > app/keystore/debug.keystore
            echo "已从 GitHub Secrets 写入固定签名密钥库：$(ls -l app/keystore/debug.keystore)"
          elif [ -f app/keystore/debug.keystore ]; then
            echo "使用仓库内的 app/keystore/debug.keystore（已入库的固定签名）"
          else
            echo "::warning::未配置固定签名！将使用运行器临时生成的 debug 密钥。"
            echo "::warning::后果：每次构建的 APK 签名都不同 → 无法覆盖安装 → 必须先卸载 → 数据全丢。"
            echo "::warning::修复方式（二选一）："
            echo "::warning::  A) 本地运行 tools/make-debug-keystore.cmd 后提交 app/keystore/debug.keystore"
            echo "::warning::  B) 把该文件转 base64 存为 GitHub Secret：KEYSTORE_BASE64"
          fi

      # 隐私红线自检：本项目承诺 100% 离线运行，绝不连网。
      - name: Privacy gate (no INTERNET permission / no network dependencies)
        run: |
          set -euo pipefail
          echo "1) 检查 AndroidManifest.xml 是否声明 INTERNET 权限"
          if grep -R "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: 发现 INTERNET 权限，违反零网络原则"
            exit 1
          fi
          echo "2) 检查依赖清单是否包含网络库"
          if grep -RniE "retrofit|okhttp|ktor|volley|firebase|crashlytics|umeng|bugly" \
             gradle/libs.versions.toml app/build.gradle.kts build.gradle.kts; then
            echo "ERROR: 发现网络/遥测相关依赖，违反零网络原则"
            exit 1
          fi
          echo "隐私自检通过：无 INTERNET 权限、无网络依赖"

      # applicationId 锁定：它一旦改变，系统会当成另一个应用 —— 覆盖安装失败、数据丢失。
      - name: applicationId lock gate
        run: |
          set -euo pipefail
          EXPECTED="com.shihua66666.nuntra"
          ACTUAL=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          NS=$(grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "applicationId=$ACTUAL namespace=$NS（期望 $EXPECTED）"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo "ERROR: applicationId 已变更！会导致覆盖安装失败、数据丢失。"; exit 1; }
          [ "$NS" = "$EXPECTED" ] || { echo "ERROR: namespace 已变更！"; exit 1; }
          echo "包名锁定校验通过"

      # ★★ 依赖兼容性锁定闸门 ★★
      #
      #   本项目曾被这个坑卡死整整一轮：35 条 AAR metadata 报错，
      #   因为 compose 1.12.x / core-ktx 1.19.x 要求 compileSdk 37 + AGP 9.1.0，
      #   而 AGP 8.13.2 支持的 compileSdk 上限是 36。
      #
      #   修完之后，这条结论必须被固化下来 —— 否则下一个人（包括未来的我）
      #   再顺手升一次依赖，就会重新掉进同一个坑，再去看 35 条 AAR 报告。
      - name: Dependency compatibility lock gate
        run: |
          set -euo pipefail
          fail=0
          TOML=gradle/libs.versions.toml

          AGP=$(grep -oP '^agp\s*=\s*"\K[^"]+' "$TOML" | head -n1)
          CS=$(grep -oP 'compileSdk\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n1)
          CORE=$(grep -oP '^coreKtx\s*=\s*"\K[^"]+' "$TOML" | head -n1)
          BOM=$(grep -oP '^composeBom\s*=\s*"\K[^"]+' "$TOML" | head -n1)
          KOTLIN=$(grep -oP '^kotlin\s*=\s*"\K[^"]+' "$TOML" | head -n1)
          echo "AGP=$AGP  compileSdk=$CS  core-ktx=$CORE  composeBom=$BOM  kotlin=$KOTLIN"

          # 1) compileSdk 必须 >= 36：下面这些依赖的 minCompileSdk 就是 36
          if [ "${CS:-0}" -lt 36 ]; then
            echo "ERROR: compileSdk=$CS 过低（要求 >= 36），checkDebugAarMetadata 会失败"
            fail=1
          fi

          # 2) core-ktx 必须 < 1.19：1.19+ 要求 compileSdk 37 与 AGP 9.1.0
          MAJOR=${CORE%%.*}; REST=${CORE#*.}; MINOR=${REST%%.*}
          if [ "$MAJOR" -gt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -ge 19 ]; }; then
            echo "ERROR: core-ktx=$CORE 需要 compileSdk 37 + AGP 9.1.0，与 AGP $AGP 不兼容"
            fail=1
          fi

          # 3) Compose BOM 不得高于 2026.06.01（再高就是 compose-ui 1.12.x，要求 compileSdk 37）
          if [[ "$BOM" > "2026.06.01" ]]; then
            echo "ERROR: composeBom=$BOM 高于 2026.06.01，会要求 compileSdk 37"
            fail=1
          fi

          # 4) AGP 高于 8.13.2 时 compileSdk 上限会变化，给警告而不是失败
          if [[ "$AGP" > "8.13.2" ]]; then
            echo "::warning::AGP=$AGP 高于 8.13.2，compileSdk 上限可能提升，请重新核对依赖"
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "依赖兼容性校验通过：与 AGP $AGP / compileSdk $CS 的组合是已知可用的"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 保留完整输出到文件：失败时下面的步骤会把它打印到控制台，
          # 这样你不下载 artifact 也能直接看到真正的错误。
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee gradle-build.log

      # ★ 失败时把真错误直接打到控制台，避免只看到一句 BUILD FAILED。
      - name: Dump Gradle failure (quick read)
        if: failure()
        run: |
          echo "==================== 编译错误行（e: file:///）===================="
          grep -n "^e: " gradle-build.log || echo "(没有 Kotlin 编译错误行)"
          echo
          echo "==================== FAILURE 上下文 ===================="
          grep -n -B 4 -A 40 "FAILURE: Build failed" gradle-build.log || true
          echo
          echo "==================== gradle-build.log 最后 120 行 ===================="
          tail -n 120 gradle-build.log || true
          echo
          echo "==================== problems-report 摘要 ===================="
          REPORT=""
          for f in build/reports/problems/problems-report.html app/build/reports/problems/problems-report.html; do
            if [ -f "$f" ]; then REPORT="$f"; break; fi
          done
          if [ -n "$REPORT" ]; then
            echo "报告文件：$REPORT"
            sed -e "s/<[^>]*>/ /g" "$REPORT" | tr -s " " " " | grep -v "^ *$" | head -n 150 || true
          else
            echo "(未找到 problems-report.html)"
          fi

      # 打印签名指纹：多次构建之间它必须完全一致，否则覆盖安装仍会失败。
      # 这是「签名是否真的固定」最直接的证据。
      - name: Report APK signature fingerprint
        if: always()
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK" ]; then echo "未找到 APK，跳过"; exit 0; fi
          echo "APK: $APK"
          echo "--- 签名证书（SHA256 指纹应在多次构建间保持不变）---"
          keytool -printcert -jarfile "$APK" | sed -n "1,14p"
          echo "--- versionCode / versionName ---"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -n 20 || true
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nuntra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nuntra-build-reports
          path: |
            gradle-build.log
            build/reports/problems/**
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
