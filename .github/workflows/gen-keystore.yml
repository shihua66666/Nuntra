name: Generate Debug Keystore (temporary, safe to delete)

# 用途：你本地没有 JDK（因此没有 keytool），但又需要那个固定的 debug 签名密钥库。
# 这个工作流在**云端**用 JDK 自带的 keytool 生成它，然后作为 Artifact 供你下载。
#
# 用法：
#   1) Actions 页面左侧选 "Generate Debug Keystore" → Run workflow
#   2) 跑完在该 run 页面最下方下载 artifact: nuntra-debug-keystore
#   3) 解压得到 debug.keystore，放到本地 app/keystore/debug.keystore
#      （没有 app/keystore 目录就自己建一个）
#   4) git add -f app/keystore/debug.keystore && git commit && git push
#   5) 之后这个工作流就可以删掉了（它只在手动触发时运行，不占 CI 时间）
#
# 说明：
#   · 生成的是 PKCS12 格式（现代 JDK 的默认），AGP 与 apksigner 都能直接读；
#   · 密码 android / android，别名 androiddebugkey —— 这是 Android 的公开约定值，
#     所以这个密钥库本来就不保密，入库是安全的；
#   · 它只用于 debug 侧载。将来做 release / 上架请另建密钥，绝不复用这一个。

on:
  workflow_dispatch:

jobs:
  gen-keystore:
    name: generate debug.keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 不需要 checkout：本工作流不依赖仓库内容，只在运行器上生成一个文件
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate debug.keystore
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          keytool -genkeypair -v \
            -keystore app/keystore/debug.keystore \
            -storetype PKCS12 \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=USA"
          echo "已生成：$(ls -l app/keystore/debug.keystore)"

      - name: Verify and print fingerprint
        run: |
          set -euo pipefail
          KS=app/keystore/debug.keystore
          echo "==================== 文件信息 ===================="
          file "$KS"
          ls -l "$KS"
          echo
          echo "==================== 证书详情 ===================="
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey \
            | grep -E "Alias name|Creation date|Valid from|Owner:|SHA1:|SHA256:|Signature algorithm" || true
          echo
          echo "★ 请把上面的 SHA256 指纹记下来。"
          echo "  之后每次 CI 构建的 APK 签名指纹都应当与它完全一致；"
          echo "  CI 的 Report APK signature fingerprint 步骤会打印同样的信息，可逐次比对。"

      - name: Export base64 (for GitHub Secret)
        run: |
          set -euo pipefail
          base64 -w0 app/keystore/debug.keystore > keystore-base64.txt
          echo "base64 长度: $(wc -c < keystore-base64.txt) 字节"
          echo "（若你不想把密钥库入库，可把下面整行存成 Secret: KEYSTORE_BASE64）"
          cat keystore-base64.txt
          echo

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: nuntra-debug-keystore
          path: |
            app/keystore/debug.keystore
            keystore-base64.txt
          if-no-files-found: error
          retention-days: 30
