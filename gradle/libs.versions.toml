[versions]
# ── 构建工具链（已实测核对 Maven 元数据，2026-04 时点）────────────
agp = "8.13.2"
kotlin = "2.4.20"

# ── AndroidX ─────────────────────────────────────────────────────
# ⚠ 以下版本已与 AGP 8.13.2 + compileSdk 36 逐一核对过 minCompileSdk。
# 升级依赖前必须确认目标的 minCompileSdk 不超过 36、minAgpVersion 不超过 8.13.2，
# 否则会出现 checkDebugAarMetadata 失败（35 条 AAR metadata 冲突就是那样来的）。
# 当前约束（实测值）：
#   compose-ui 1.11.4 / material3 1.4.0 / foundation 1.11.4 → minCompileSdk 35
#   core-ktx 1.18.0 / activity-compose 1.13.0              → minCompileSdk 36
#   lifecycle 2.10.0                                       → minCompileSdk 34~35
#   datastore 1.2.1 / savedstate 1.5.0                     → minCompileSdk 34
# 已被排除的高版本：compose 1.12.x（37 / 需 AGP 9.1）、core-ktx 1.19.x（37）、
# lifecycle 2.11.0（37）—— 它们都要求 AGP 9.1.0+ 与 compileSdk 37。
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
savedstate = "1.5.0"
datastore = "1.2.1"

# ── Compose（BOM 统一版本；编译器插件版本跟随 Kotlin）────────────
# 2026.06.01 是最后一条 compose-ui 1.11.x 线（1.12.0 起要求 compileSdk 37 与 AGP 9.1）
composeBom = "2026.06.01"

# ── 序列化 ────────────────────────────────────────────────────────
kotlinxSerialization = "1.11.0"

# ── 测试 ──────────────────────────────────────────────────────────
junit = "4.13.2"
androidxJunit = "1.3.0"

[libraries]
# 核心 / 生命周期
androidx-core-ktx                    = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose            = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# lifecycle-runtime-ktx 提供 setViewTreeLifecycleOwner / setViewTreeViewModelStoreOwner 的 KTX 扩展
androidx-lifecycle-runtime-ktx       = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process           = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-service           = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
# savedstate-ktx 提供 setViewTreeSavedStateRegistryOwner 的 KTX 扩展（注意：属于 androidx.savedstate，不是 lifecycle）
androidx-savedstate-ktx              = { module = "androidx.savedstate:savedstate-ktx", version.ref = "savedstate" }
# DataStore
androidx-datastore-preferences       = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# 序列化
kotlinx-serialization-json           = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Compose（由 BOM 管版本，不写 version）
androidx-compose-bom                 = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui                  = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics         = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3           = { module = "androidx.compose.material3:material3" }
androidx-compose-foundation          = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material-icons-ext  = { module = "androidx.compose.material:material-icons-extended" }

# 测试
junit                                = { module = "junit:junit", version.ref = "junit" }
androidx-junit                       = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-compose-ui-test-manifest    = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0 起 Compose 编译器为独立插件，版本跟随 Kotlin
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
